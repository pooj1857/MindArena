<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrainBattle | Challenge Your Mind</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 229, 255, 0.13), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(155, 89, 255, 0.16), transparent 30%),
                #050816;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: linear-gradient(to bottom, black, transparent);
        }

        nav {
            width: 100%;
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 229, 255, 0.25);
            background: rgba(4, 8, 24, 0.9);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.08);
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
        }

        .logo span {
            color: #00e5ff;
        }

        nav a {
            color: #b9f8ff;
            text-decoration: none;
            border: 1px solid rgba(0, 229, 255, 0.5);
            padding: 11px 20px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: rgba(0, 229, 255, 0.06);
            clip-path: polygon(
                10px 0,
                100% 0,
                100% calc(100% - 10px),
                calc(100% - 10px) 100%,
                0 100%,
                0 10px
            );
            transition: 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
            background: rgba(0, 229, 255, 0.18);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            transform: translateY(-2px);
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
            position: relative;
        }

        .hero h1 {
            font-size: clamp(34px, 5vw, 65px);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
            color: #ffffff;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.15),
                0 0 30px rgba(0, 229, 255, 0.2);
        }

        .hero h1 span {
            color: #00e5ff;
            text-shadow:
                0 0 8px #00e5ff,
                0 0 25px rgba(0, 229, 255, 0.8);
        }

        .hero p {
            margin-top: 18px;
            color: #9ba9c9;
            font-size: 16px;
            letter-spacing: 1px;
        }

        form {
            width: 100%;
        }

        .main-card {
            width: min(1100px, 92%);
            margin: 15px auto 60px;
            padding: 35px;
            position: relative;
            background:
                linear-gradient(145deg, rgba(11, 23, 52, 0.97), rgba(7, 12, 31, 0.98));
            border: 1px solid rgba(0, 229, 255, 0.65);
            box-shadow:
                0 0 0 1px rgba(145, 70, 255, 0.2),
                0 0 35px rgba(0, 229, 255, 0.08),
                inset 0 0 35px rgba(0, 229, 255, 0.025);
            clip-path: polygon(
                25px 0,
                calc(100% - 25px) 0,
                100% 25px,
                100% calc(100% - 25px),
                calc(100% - 25px) 100%,
                25px 100%,
                0 calc(100% - 25px),
                0 25px
            );
        }

        .main-card::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(143, 75, 255, 0.3);
            pointer-events: none;
            clip-path: polygon(
                18px 0,
                calc(100% - 18px) 0,
                100% 18px,
                100% calc(100% - 18px),
                calc(100% - 18px) 100%,
                18px 100%,
                0 calc(100% - 18px),
                0 18px
            );
        }

        .main-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 180px;
            height: 2px;
            transform: translateX(-50%);
            background: #00e5ff;
            box-shadow:
                0 0 8px #00e5ff,
                0 0 20px #00e5ff;
        }

        .name-box {
            position: relative;
            z-index: 1;
            margin-bottom: 40px;
        }

        .name-box label {
            display: block;
            margin-bottom: 12px;
            color: #c8faff;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .name-box input {
            width: 100%;
            padding: 17px 20px;
            border: 1px solid rgba(0, 229, 255, 0.5);
            outline: none;
            color: #ffffff;
            font-size: 16px;
            background: rgba(118, 219, 228, 0.045);
            clip-path: polygon(
                12px 0,
                100% 0,
                100% calc(100% - 12px),
                calc(100% - 12px) 100%,
                0 100%,
                0 12px
            );
            transition: 0.3s ease;
        }

        .name-box input::placeholder {
            color: #b9cbee;
        }

        .name-box input:focus {
            border-color: #00e5ff;
            background: rgba(0, 229, 255, 0.09);
            box-shadow:
                0 0 10px rgba(194, 200, 200, 0.2),
                inset 0 0 12px rgba(231, 235, 235, 0.05);
        }

        /* =====================================
   SPIN YOUR SUBJECT WHEEL - TITLE
   ===================================== */

.wheel-section h2,
.wheel-wrapper h2,
.wheel-container h2,
.spin-title,
#spinTitle {
    colour:white;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 800;
    letter-spacing: 1.5px;
    text-align: center;
    text-transform: uppercase;


    /* White + purple + cyan gradient */
    background: linear-gradient(
        90deg,
        #ffffff 0%,
        #d9d9ff 25%,
        #c56bff 55%,
        #00eeff 100%
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

    text-shadow: none;


    margin: 0 auto 12px;
    line-height: 1.2;
}

/* If the title contains an icon */
.wheel-section h2::first-letter,
.wheel-wrapper h2::first-letter,
.wheel-container h2::first-letter {
    -webkit-text-fill-color: #d1e0e1;
}

/* Subtitle */
.wheel-section p,
.wheel-wrapper p,
.wheel-container p,
.spin-subtitle {
    color: #dbdde8;
    text-align: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(16px, 2vw, 21px);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 0 10px rgba(157, 212, 216, 0.3);
}

        /* =========================================
   MIND ARENA - NEON SUBJECT WHEEL
   ========================================= */

/* Wheel outer layout */
.wheel-section,
.wheel-wrapper,
.wheel-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    margin: 25px auto 0;
    padding: 20px 0 35px;
}

/* Wheel title */
.wheel-section h2,
.wheel-wrapper h2,
.wheel-container h2 {
    text-align: center;
    margin-bottom: 8px;
}

/* Wheel area */
.wheel-area {
    width: min(90vw, 650px);
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin: 20px auto;
}

/* Decorative glowing rings behind wheel */
.wheel-area::before {
    content: "";
    position: absolute;
    width: 102%;
    height: 102%;
    border-radius: 50%;
    border: 2px solid rgba(0, 238, 255, 0.65);
    box-shadow:
        0 0 10px #00eeff,
        0 0 25px rgba(0, 238, 255, 0.6),
        0 0 60px rgba(0, 238, 255, 0.25);
    pointer-events: none;
}

.wheel-area::after {
    content: "";
    position: absolute;
    width: 108%;
    height: 108%;
    border-radius: 50%;
    border: 2px dashed rgba(168, 85, 247, 0.75);
    box-shadow:
        0 0 15px rgba(168, 85, 247, 0.5),
        inset 0 0 20px rgba(168, 85, 247, 0.15);
    pointer-events: none;
    animation: ringGlow 3s ease-in-out infinite alternate;
}

@keyframes ringGlow {
    from {
        opacity: 0.55;
        transform: scale(0.99);
    }

    to {
        opacity: 1;
        transform: scale(1.01);
    }
}

/* Main wheel */
.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    border: 8px solid #071532;
    background: conic-gradient(
        #08b8ee 0deg 24deg,
        #7138e8 24deg 48deg,
        #ff2992 48deg 72deg,
        #ff8615 72deg 96deg,
        #13c9c0 96deg 120deg,
        #a448f5 120deg 144deg,
        #168cf0 144deg 168deg,
        #ffbd19 168deg 192deg,
        #00cdbd 192deg 216deg,
        #8c42e8 216deg 240deg,
        #f32991 240deg 264deg,
        #ff7418 264deg 288deg,
        #18b9ee 288deg 312deg,
        #7540ec 312deg 336deg,
        #0dc8c4 336deg 360deg
    );
    box-shadow:
        0 0 0 3px rgba(0, 238, 255, 0.6),
        0 0 20px #00eeff,
        0 0 50px rgba(0, 238, 255, 0.55),
        inset 0 0 30px rgba(0, 0, 0, 0.65);
    transform-origin: center center;
    transition: transform 5s cubic-bezier(0.15, 0.75, 0.15, 1);
    z-index: 2;
}

/* Segment separator overlay */
.wheel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
        repeating-conic-gradient(
            from 0deg,
            transparent 0deg 23deg,
            rgba(5, 8, 23, 0.75) 23deg 24deg
        );
    pointer-events: none;
    z-index: 3;
}

/* Wheel labels */
.wheel-segment,
.segment,
.wheel-item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    pointer-events: none;
    z-index: 4;
}

/* Text inside segments */
.wheel-segment span,
.segment span,
.wheel-item span,
.wheel-label {
    position: absolute;
    top: 11%;
    width: 75px;
    color: #ffffff;
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(11px, 1.6vw, 17px);
    font-weight: 700;
    line-height: 1.05;
    text-align: center;
    text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.8),
        0 0 8px rgba(255, 255, 255, 0.35);
    transform: rotate(0deg);
}

/* Center circle */
.wheel-center,
.spin-center,
.spin-button {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 25%;
    aspect-ratio: 1 / 1;
    min-width: 105px;
    min-height: 105px;
    max-width: 165px;
    max-height: 165px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 35% 30%, #172d63, #07132f 65%);
    border: 5px solid #00eeff;
    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(20px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 10;
    box-shadow:
        0 0 0 5px rgba(168, 85, 247, 0.45),
        0 0 15px #00eeff,
        0 0 35px rgba(0, 238, 255, 0.75),
        inset 0 0 25px rgba(0, 238, 255, 0.2);
    transition: 0.3s ease;
}

.wheel-center:hover,
.spin-center:hover,
.spin-button:hover {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
        0 0 0 6px rgba(168, 85, 247, 0.6),
        0 0 25px #00eeff,
        0 0 60px rgba(0, 238, 255, 0.9),
        inset 0 0 30px rgba(0, 238, 255, 0.3);
}

.wheel-center:active,
.spin-center:active,
.spin-button:active {
    transform: translate(-50%, -50%) scale(0.96);
}

/* Pointer above the wheel */
.wheel-pointer,
.pointer,
.wheel-arrow {
    position: absolute;
    top: -27px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 25px solid transparent;
    border-right: 25px solid transparent;
    border-top: 48px solid #ff3f9f;
    filter:
        drop-shadow(0 0 5px #ff3f9f)
        drop-shadow(0 0 15px #ff3f9f);
    z-index: 20;
}

/* Pointer inner highlight */
.wheel-pointer::before,
.pointer::before,
.wheel-arrow::before {
    content: "";
    position: absolute;
    left: -13px;
    top: -43px;
    width: 0;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 27px solid #ff8bd0;
}

/* Small decorative center glow */
.wheel-center::before,
.spin-center::before,
.spin-button::before {
    content: "";
    position: absolute;
    width: 65%;
    height: 65%;
    border-radius: 50%;
    border: 1px solid rgba(0, 238, 255, 0.5);
    box-shadow: 0 0 12px rgba(0, 238, 255, 0.4);
    pointer-events: none;
}

/* Disable button while spinning */
.spin-button:disabled,
.wheel-center:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    filter: grayscale(0.2);
}

/* Mobile view */
@media (max-width: 600px) {
    .wheel-area {
        width: 86vw;
        margin-top: 30px;
    }

    .wheel {
        border-width: 5px;
    }

    .wheel-center,
    .spin-center,
    .spin-button {
        min-width: 75px;
        min-height: 75px;
        font-size: 18px;
        border-width: 3px;
    }

    .wheel-pointer,
    .pointer,
    .wheel-arrow {
        top: -20px;
        border-left-width: 18px;
        border-right-width: 18px;
        border-top-width: 35px;
    }
}

/* =====================================
   IMPROVED CENTER SPIN BUTTON
   ===================================== */

.spin-button,
.spin-center,
.wheel-center,
#spinButton {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

    width: 128px;
    height: 128px;
    min-width: 128px;
    min-height: 128px;

    border-radius: 50%;
    border: 4px solid #00eeff;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 35% 25%,
            #274a86 0%,
            #10285b 38%,
            #071535 75%,
            #040b20 100%
        );

    color: #ffffff;
    font-family: 'Orbitron', sans-serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;

    cursor: pointer;
    z-index: 50;

    box-shadow:
        0 0 0 5px rgba(168, 85, 247, 0.55),
        0 0 12px #00eeff,
        0 0 28px rgba(0, 238, 255, 0.8),
        inset 0 0 18px rgba(0, 238, 255, 0.18);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

/* Inner circular border */
.spin-button::before,
.spin-center::before,
.wheel-center::before,
#spinButton::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0, 238, 255, 0.55);
    box-shadow:
        inset 0 0 12px rgba(0, 238, 255, 0.25),
        0 0 8px rgba(0, 238, 255, 0.2);
    pointer-events: none;
}

/* Small futuristic arrows */
.spin-button::after,
.spin-center::after,
.wheel-center::after,
#spinButton::after {
    content: "⌃";
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #00eeff;
    font-size: 19px;
    font-weight: bold;
    text-shadow: 0 0 8px #00eeff;
    pointer-events: none;
}

/* Hover effect */
.spin-button:hover,
.spin-center:hover,
.wheel-center:hover,
#spinButton:hover {
    transform: translate(-50%, -50%) scale(1.08);

    background:
        radial-gradient(
            circle at 35% 25%,
            #3869ad 0%,
            #173b78 40%,
            #081b42 75%,
            #040b20 100%
        );

    box-shadow:
        0 0 0 6px rgba(168, 85, 247, 0.7),
        0 0 18px #00eeff,
        0 0 42px rgba(0, 238, 255, 1),
        inset 0 0 22px rgba(0, 238, 255, 0.3);
}

/* Click effect */
.spin-button:active,
.spin-center:active,
.wheel-center:active,
#spinButton:active {
    transform: translate(-50%, -50%) scale(0.94);
}

/* Mobile size */
@media (max-width: 600px) {
    .spin-button,
    .spin-center,
    .wheel-center,
    #spinButton {
        width: 92px;
        height: 92px;
        min-width: 92px;
        min-height: 92px;
        font-size: 19px;
        border-width: 3px;
    }

    .spin-button::before,
    .spin-center::before,
    .wheel-center::before,
    #spinButton::before {
        inset: 7px;
    }
}
        .subject-grid {

        }

        }

            box-shadow:
                0 0 15px #00e5ff,
                0 0 35px rgba(0, 229, 255, 0.7);
            transform: translateY(-3px);
        }

        @media (max-width: 900px) {
            .subject-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .main-card {
                padding: 28px;
            }
        }

        @media (max-width: 650px) {
            nav {
                padding: 0 20px;
            }

            .logo {
                font-size: 22px;
            }

            nav a {
                padding: 9px 12px;
                font-size: 12px;
            }

            .hero {
                padding-top: 40px;
            }

            .main-card {
                width: 94%;
                padding: 22px 16px;
            }

            .subject-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .difficulty-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .wheel-box {
                width: 270px;
                height: 270px;
            }

            .spin-section h2,
            .section-title {
                font-size: 19px;
            }
        }

        @media (max-width: 380px) {
            .subject-grid {
                grid-template-columns: 1fr 1fr;
            }

            .subject-card div {
                min-height: 90px;
                font-size: 12px;
            }

            .wheel-box {
                width: 240px;
                height: 240px;
            }
        }

        .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 360px;
}

.logo img {
    width: 100%;
    max-width: 360px;
    height: auto;
    display: block;
    object-fit: contain;
    border-radius: 12px;
}
    </style>
</head>

<body>

    <nav>
        <div class="brain-logo">
    <div class="logo">
    <h4>🧠Brain <span>Battle</span>💡</h4>
</div>
</div>

        <a href="{{ url_for('history') }}">
            📊 Quiz History
        </a>
    </nav>

    <section class="hero">
        <h1>
            Challenge Your <span>Mind</span>
        </h1>

        <p>
            Learn, compete and discover your knowledge power.
        </p>
    </section>

    <form method="POST">

        <div class="main-card">

            <div class="name-box">
                <label for="player_name">
                    👤 Enter Your Name
                </label>

                <input
                    type="text"
                    id="player_name"
                    name="player_name"
                    placeholder="Enter your name to begin..."
                    required
                >
            </div>

            <section class="spin-section">
                <h2>🎡 Spin Your Subject Wheel</h2>

                <p>
                    Spin the wheel and let it choose your quiz subject!
                </p>

                <div class="wheel-wrapper">

                    <div class="wheel-arrow">▼</div>

                    <div class="wheel-box">
                        <canvas
                            id="spinWheel"
                            width="500"
                            height="500">
                        </canvas>

                        <button
                            id="spinButton"
                            type="button">
                            SPIN
                        </button>
                    </div>

                </div>

                <div id="wheelResult"></div>
            </section>

            <div class="subject-grid">

                {% for subject in subjects %}

                <label class="subject-card">

                    <input
                        type="radio"
                        name="subject"
                        value="{{ subject }}"
                        {% if loop.first %}checked{% endif %}
                        required
                    >

             <div>
    {% if subject == "Maths" %}
        ➗
    {% elif subject == "Science" %}
        🔬
    {% elif subject == "History" %}
        🏛️
    {% elif subject == "English" %}
        📖
    {% elif subject == "Hindi" %}
        🪔
    {% elif subject == "Computer" %}
        💻
    {% elif subject == "General knowledge" %}
        🌍
    {% elif subject == "Environmental Studies" %}
        🌱
    {% elif subject == "Geography" %}
        🗺️
    {% elif subject == "Physics" %}
        ⚛️
    {% elif subject == "Chemistry" %}
        🧪
    {% elif subject == "Biology" %}
        🧬
    {% elif subject == "Space and astronomy" %}
        🚀
    {% elif subject == "Physical education" %}
        ⚽
    {% elif subject == "Art and Music" %}
        🎨
    {% else %}
        🧠
    {% endif %}
                        <br><br>

                        {{ subject }}
                    </div>

                </label>

                {% endfor %}

            </div>

            <h2 class="section-title">
                ⭐ Select Difficulty Mode
            </h2>

            <div class="difficulty-grid">

                <label class="difficulty-card">
                    <input
                        type="radio"
                        name="difficulty"
                        value="Easy"
                        checked
                        required
                    >

                    <div>
                        🟢 Easy
                    </div>
                </label>

                <label class="difficulty-card">
                    <input
                        type="radio"
                        name="difficulty"
                        value="Medium"
                        required
                    >

                    <div>
                        🟡 Medium
                    </div>
                </label>

                <label class="difficulty-card">
                    <input
                        type="radio"
                        name="difficulty"
                        value="Hard"
                        required
                    >

                    <div>
                        🔴 Hard
                    </div>
                </label>

            </div>

            <button
                class="start-btn"
                type="submit">
                🚀 Start Quiz
            </button>

        </div>

    </form>

    <script>
        const canvas = document.getElementById("spinWheel");
        const ctx = canvas.getContext("2d");
        const spinButton = document.getElementById("spinButton");
        const wheelResult = document.getElementById("wheelResult");

        const subjects = [
            {% for subject in subjects %}
                "{{ subject }}"{% if not loop.last %},{% endif %}
            {% endfor %}
        ];

        const colors = [
            "#00e5ff",
            "#8e3dff",
            "#ff3cac",
            "#00c896",
            "#ffb000",
            "#4361ee",
            "#f72585",
            "#4cc9f0",
            "#7209b7",
            "#06d6a0",
            "#fb5607",
            "#3a86ff",
            "#8338ec",
            "#ff006e",
            "#118ab2",
            "#ef476f"
        ];

        let rotation = 0;
        let spinning = false;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 8;
            const sliceAngle = (2 * Math.PI) / subjects.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            subjects.forEach((subject, index) => {
                const startAngle = rotation + index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(
                    centerX,
                    centerY,
                    radius,
                    startAngle,
                    endAngle
                );
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();

                ctx.strokeStyle = "#071027";
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.save();

                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);

                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 17px Arial";
                ctx.shadowColor = "rgba(0,0,0,0.7)";
                ctx.shadowBlur = 4;

                let displayText = subject;

                if (displayText.length > 15) {
                    displayText = displayText.substring(0, 14) + "...";
                }

                ctx.fillText(displayText, radius - 18, 6);

                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(centerX, centerY, 43, 0, 2 * Math.PI);
            ctx.fillStyle = "#101a3a";
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function spinWheel() {
            if (spinning || subjects.length === 0) {
                return;
            }

            spinning = true;
            spinButton.disabled = true;
            wheelResult.textContent = "Spinning...";

            const selectedIndex = Math.floor(Math.random() * subjects.length);
            const sliceAngle = (2 * Math.PI) / subjects.length;

            const targetRotation =
                (3 * 2 * Math.PI) +
                (Math.PI * 1.5) -
                (selectedIndex * sliceAngle) -
                (sliceAngle / 2);

            const startRotation = rotation;
            const finalRotation = startRotation + targetRotation;
            const duration = 4000;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                const easeOut =
                    1 - Math.pow(1 - progress, 4);

                rotation =
                    startRotation +
                    (finalRotation - startRotation) * easeOut;

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    rotation = finalRotation;
                    spinning = false;
                    spinButton.disabled = false;

                    const selectedSubject = subjects[selectedIndex];

                    wheelResult.textContent =
                        "Selected Subject: " + selectedSubject;

                    const subjectRadio = document.querySelector(
                        'input[name="subject"][value="' +
                        CSS.escape(selectedSubject) +
                        '"]'
                    );

                    if (subjectRadio) {
                        subjectRadio.checked = true;
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        spinButton.addEventListener("click", spinWheel);

        drawWheel();
    </script>

</body>
</html>
